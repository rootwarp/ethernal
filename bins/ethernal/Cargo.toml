[package]
name = "ethernal"
version.workspace = true
edition.workspace = true
description = "Generate, build, sign, and broadcast Ethereum Beacon Chain deposit transactions"

[[bin]]
name = "ethernal"
path = "src/main.rs"

[features]
# Forwarded to the signer crate: real Ledger HID transport.
ledger = ["ethernal-signer/ledger"]

[dependencies]
ethernal-core = { workspace = true }
ethernal-keystore = { workspace = true }
ethernal-secretfile = { workspace = true }
ethernal-tx = { workspace = true }
ethernal-signer = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
zeroize = { workspace = true }
rpassword = { workspace = true }

[dev-dependencies]
# Flip on test-support for integration tests only (resolver-2: not unified into
# release builds). Exposes ethernal_keystore::decrypt_v3 for T-3 / E3-1.
ethernal-keystore = { workspace = true, features = ["test-support"] }
# Integration tests only (binary-only package has no lib re-export of deps).
# Used by `ethernal_no_tty` to `setsid` the child so `/dev/tty` fails under an
# interactive cargo test session.
libc = { workspace = true }
