[package]
name = "ethernal-keystore"
version.workspace = true
edition.workspace = true
description = "EIP-2335 v4 keystore encryption/decryption, directory scanning, and passphrase sources"

[lib]
name = "ethernal_keystore"

[dependencies]
ethernal-secretfile = { workspace = true }
scrypt = { workspace = true }
pbkdf2 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
unicode-normalization = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rpassword = { workspace = true }

[features]
# Test-only surfaces (e.g. decrypt_v3). Empty feature: no extra deps.
# Compiled out of release under resolver = "2" when enabled only via
# consumers' [dev-dependencies] (see decrypt_v3 module header).
test-support = []

[dev-dependencies]
