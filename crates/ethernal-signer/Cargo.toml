[package]
name = "ethernal-signer"
version.workspace = true
edition.workspace = true
description = "EIP-1559 transaction signers: local secp256k1 key and Ledger hardware wallet"

[lib]
name = "ethernal_signer"

[features]
# Real Ledger HID transport. Off by default: without it, the Ledger signer
# constructor returns LedgerNotSupported (parity with non-CGO Go builds).
ledger = ["dep:hidapi"]

[dependencies]
ethernal-tx = { workspace = true }
k256 = { workspace = true }
sha3 = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hidapi = { workspace = true, optional = true }

[dev-dependencies]
