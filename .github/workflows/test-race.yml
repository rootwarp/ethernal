name: test-race

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  race:
    name: go test -race (M0.1)
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: go test -race ./...
        run: go test -race ./...
        working-directory: go
