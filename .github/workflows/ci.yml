name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Test ethernal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-18
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (≈ v2.9.1, 2026-03-12)

      - name: Lint (clippy + rustfmt)
        run: make lint

      - name: Test (unit + integration)
        run: make test

      - name: E2E mock (build+sign+send via mock broadcaster, no real RPC)
        run: make e2e-mock

      - name: Build (release, ledger feature compile check)
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev
          cargo build --release --features ledger
