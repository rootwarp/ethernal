name: cross-validate

# M1.7-1/2/3: hermetic cross-validate lane for ethstaker-deposit-cli (FR-P1-G1 / GO-059).
# Per architecture §11.3 + §12.3: tagged (or every PR) trigger; image pulled by immutable
# SHA-256 digest (not :latest or mutable tag); runs the build-tagged Go test that execs
# the real CLI for hoodi + mainnet using sanitized env (M1.1-7).
#
# Image: built from root Dockerfile.cross-validate (python slim + pinned ethstaker-deposit-cli).
# Image build/push happens *once per pin bump* (when the VER in Dockerfile changes);
# the resulting ghcr.io digest is recorded here. (Split-watch: full build/push job
# scaffolding + make test-cross-validate proxy descoped to M1.7-3 follow-up; this
# provides the minimal runnable structure + SHA pin site.)
#
# To update pin:
#   1. Bump ethstaker-deposit-cli==VER in Dockerfile.cross-validate (record VER + date).
#   2. docker build -f Dockerfile.cross-validate -t cross-validate-test .
#   3. (push to GHCR under appropriate org/repo tag/digest)
#   4. Capture the @sha256: digest of the pushed image.
#   5. Replace the IMAGE=...@sha256 line below + update go/docs/SECURITY.md .
#   6. The test (M1.7-2) will be invoked as: DEPOSIT_CLI_BIN=ethstaker-deposit-cli go test -tags=cross_validate ./cmd/eth-deposit-gen/...
#
# Local repro (after M1.7-2 lands + image available):
#   docker run --rm -v "$PWD/go:/work" -w /work -e DEPOSIT_CLI_BIN=ethstaker-deposit-cli \
#     ghcr.io/.../cross-validate@sha256:XXX \
#     bash -c 'CGO_ENABLED=1 go test -tags=cross_validate ./cmd/eth-deposit-gen/...'

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # tagged trigger per arch §12.3 table (cross-validate-deposit-cli row); also manual
  workflow_dispatch:

jobs:
  cross-validate:
    name: go test -tags=cross_validate (M1.7 hermetic ethstaker-deposit-cli)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Extract hermetic ethstaker-deposit-cli from pinned image (SHA-256)
        # Pull-by-digest is the pin (immutable). The image contains only the CLI + refuse check.
        # We extract the binary to the runner so the Go test (which needs CGO + full Go env)
        # can exec it via DEPOSIT_CLI_BIN (or PATH). This keeps the python base minimal.
        # (Alternative patterns like full job-in-container would require a Go+python hybrid image;
        # extraction reuses existing runner + differential-oracle pin/cache style.)
        run: |
          IMAGE="ghcr.io/rootwarp/eth-utils/cross-validate@sha256:REPLACE_WITH_ACTUAL_DIGEST_FROM_PINNED_BUILD"
          echo "Using cross-validate image: $IMAGE"
          docker create --name cli-extract "$IMAGE"
          docker cp cli-extract:/usr/local/bin/ethstaker-deposit-cli /usr/local/bin/ethstaker-deposit-cli
          docker rm cli-extract
          chmod +x /usr/local/bin/ethstaker-deposit-cli
          /usr/local/bin/ethstaker-deposit-cli --version | grep -i ethstaker || {
            echo "FATAL: extracted CLI --version lacks 'ethstaker' (research/01 R2 refuse failed)"
            exit 1
          }
          echo "DEPOSIT_CLI_BIN=/usr/local/bin/ethstaker-deposit-cli" >> "$GITHUB_ENV"
          echo "Extracted and verified ethstaker-deposit-cli for cross-validate tests."

      - name: go test -tags=cross_validate ./cmd/eth-deposit-gen/... (hoodi + mainnet)
        # Future (M1.7-2): the test binary will read DEPOSIT_CLI_BIN, refuse if !ethstaker,
        # generate using deterministic testdata, pipe to CLI verify --deposit-data, assert 0+no-stderr.
        # Sanitized env is applied inside the test's exec of the CLI (reuses M1.1-7 helper).
        # Run for supported networks (the test matrix covers hoodi/mainnet per phase).
        # working-directory + CGO per all other go CI jobs.
        env:
          CGO_ENABLED: 1
        run: |
          cd go
          go test -tags=cross_validate ./cmd/eth-deposit-gen/... -count=1 -timeout=5m
