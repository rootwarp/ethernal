name: e2e-live

# Live (anvil) tier — schedule (nightly), release tags, and manual dispatch.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  push:
    tags:
      - 'v*.*.*'

jobs:
  live:
    name: E2E live (anvil)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026-07-18
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (≈ v2.9.1, 2026-03-12)

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          version: v1.7.1

      - name: E2E live (ignored anvil tests)
        run: make e2e-live
